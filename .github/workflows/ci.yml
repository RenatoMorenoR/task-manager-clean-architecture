name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Restore dependencies
        run: dotnet restore backend/TaskManager.sln
        
      - name: Build
        run: dotnet build backend/TaskManager.sln --no-restore -c Release
        
      - name: Test
        run: dotnet test backend/TaskManager.sln --no-build -c Release --verbosity normal

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: cd frontend && npm ci
        
      - name: Run Tests
        run: cd frontend && npm test
        
      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:5001

  docker:
    name: Build Docker Images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Backend Image
        run: docker build -t taskmanager-api:latest -f backend/TaskManager.API/Dockerfile ./backend
        
      - name: Build Frontend Image
        run: docker build -t taskmanager-frontend:latest -f frontend/Dockerfile ./frontend
